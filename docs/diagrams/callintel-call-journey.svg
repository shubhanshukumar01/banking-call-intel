<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="One 6,000-line call: 65.8 thousand tokens shrink to 12.1 thousand after cleaning; 6,001 lines become 1,882; 3 of 6 sections go to the AI; 17 AI calls; one verified JSON in 133 seconds on a laptop."><defs><marker id="f2-ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#13202A"/></marker></defs><rect width="1600" height="560" style="fill:#FFFFFF"/><text x="40" y="50" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:26px;font-weight:700">One 6,000-line call, start to finish</text><text x="40" y="78" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:400">Measured on a synthetic 6,000-line test call, on a laptop GPU (RTX 3060, 4B local model). Bank servers process faster.</text><text x="50" y="128" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1.2px">AMOUNT OF TEXT (TOKENS), TO SCALE</text><rect x="50" y="142" width="1500" height="34" rx="6" style="fill:#DCE3E8;stroke:none;stroke-width:1.5"/><text x="64" y="165" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:600">Raw transcript: 65.8k tokens</text><rect x="50" y="188" width="275.83586626139817" height="34" rx="6" style="fill:#0E7C72;stroke:none;stroke-width:1.5"/><text x="339.83586626139817" y="211" text-anchor="start" style="fill:#0E7C72;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:600">After cleaning and repetition removal: 12.1k tokens (82% less to process)</text><rect x="50" y="280" width="258" height="150" rx="12" style="fill:#FFFFFF;stroke:#B8C4CC;stroke-width:1.5"/><text x="70" y="338" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:38px;font-weight:700">6,001</text><text x="70" y="374" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">lines in the</text><text x="70" y="396" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">transcript</text><path d="M312,355 L356,355" style="fill:none;stroke:#13202A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f2-ah-ink)"/><text x="334.0" y="342" text-anchor="middle" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:12px;font-weight:600">clean</text><rect x="360" y="280" width="258" height="150" rx="12" style="fill:#FFFFFF;stroke:#B8C4CC;stroke-width:1.5"/><text x="380" y="338" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:38px;font-weight:700">1,882</text><text x="380" y="374" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">lines kept after</text><text x="380" y="396" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">removing noise &amp; repeats</text><path d="M622,355 L666,355" style="fill:none;stroke:#13202A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f2-ah-ink)"/><text x="644.0" y="342" text-anchor="middle" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:12px;font-weight:600">focus</text><rect x="670" y="280" width="258" height="150" rx="12" style="fill:#FFFFFF;stroke:#B8C4CC;stroke-width:1.5"/><text x="690" y="338" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:38px;font-weight:700">3 of 6</text><text x="690" y="374" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">sections worth sending</text><text x="690" y="396" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">to the AI</text><path d="M932,355 L976,355" style="fill:none;stroke:#13202A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f2-ah-ink)"/><text x="954.0" y="342" text-anchor="middle" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:12px;font-weight:600">AI</text><rect x="980" y="280" width="258" height="150" rx="12" style="fill:#FFFFFF;stroke:#B8C4CC;stroke-width:1.5"/><text x="1000" y="338" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:38px;font-weight:700">17</text><text x="1000" y="374" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">AI calls to extract,</text><text x="1000" y="396" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">analyse and verify</text><path d="M1242,355 L1286,355" style="fill:none;stroke:#13202A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f2-ah-ink)"/><text x="1264.0" y="342" text-anchor="middle" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:12px;font-weight:600">verify</text><rect x="1290" y="280" width="258" height="150" rx="12" style="fill:#E7F4EA;stroke:#1F7A3A;stroke-width:1.5"/><text x="1310" y="338" text-anchor="start" style="fill:#1F7A3A;font-family:Segoe UI, Arial, sans-serif;font-size:38px;font-weight:700">133 s</text><text x="1310" y="374" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">to one verified JSON</text><text x="1310" y="396" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">file, on a laptop</text><text x="50" y="490" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:400">One laptop handles roughly 27 long calls an hour. For 1,000+ calls a day, the same pipeline runs on a GPU server or an approved cloud model, with many workers in parallel.</text></svg>