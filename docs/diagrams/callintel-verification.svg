<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="Verification: each AI claim must pass five checks: allowed values, real transcript line references, matching quotes, matching figures and an independent fact-checker. Failures get one retry, then are removed or flagged for human review; passing claims are reported with evidence."><defs><marker id="f4-ah-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#B42318"/></marker><marker id="f4-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#1F7A3A"/></marker></defs><rect width="1600" height="560" style="fill:#FFFFFF"/><text x="40" y="50" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:26px;font-weight:700">How every insight is checked before it is reported</text><text x="40" y="78" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:400">Each claim must pass every gate. A failed claim gets one retry; if it still fails, it is removed or marked &#x27;unclear&#x27; and the call is flagged for a person to review.</text><rect x="40" y="150" width="210" height="150" rx="12" style="fill:#FDF2E4;stroke:#A85A06;stroke-width:1.5"/><text x="58" y="180" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15.5px;font-weight:700">AI agent claim</text><text x="58" y="210" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">&quot;Customer declined</text><text x="58" y="232" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">the loan offer&quot;</text><text x="58" y="262" text-anchor="start" style="fill:#A85A06;font-family:Consolas, Menlo, monospace;font-size:13px;font-weight:600">cites line L211</text><rect x="282" y="150" width="196" height="150" rx="12" style="fill:#FFFFFF;stroke:#1F7A3A;stroke-width:1.5"/><circle cx="304" cy="176" r="12" style="fill:#1F7A3A"/><text x="304" y="181" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700">1</text><text x="324" y="182" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:700">Allowed values</text><text x="300" y="222" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">answers use the bank&#x27;s</text><text x="300" y="244" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">fixed lists only</text><text x="300" y="284" text-anchor="start" style="fill:#1F7A3A;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700">pass ✓</text><path d="M253,225 L279,225" style="fill:none;stroke:#1F7A3A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f4-ah-ok)"/><line x1="380.0" y1="302" x2="380.0" y2="342" style="stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3"/><rect x="504" y="150" width="196" height="150" rx="12" style="fill:#FFFFFF;stroke:#1F7A3A;stroke-width:1.5"/><circle cx="526" cy="176" r="12" style="fill:#1F7A3A"/><text x="526" y="181" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700">2</text><text x="546" y="182" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:700">Cites the transcript</text><text x="522" y="222" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">refers to real</text><text x="522" y="244" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">line numbers</text><text x="522" y="284" text-anchor="start" style="fill:#1F7A3A;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700">pass ✓</text><path d="M481,225 L501,225" style="fill:none;stroke:#1F7A3A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f4-ah-ok)"/><line x1="602.0" y1="302" x2="602.0" y2="342" style="stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3"/><rect x="726" y="150" width="196" height="150" rx="12" style="fill:#FFFFFF;stroke:#1F7A3A;stroke-width:1.5"/><circle cx="748" cy="176" r="12" style="fill:#1F7A3A"/><text x="748" y="181" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700">3</text><text x="768" y="182" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:700">Quote matches</text><text x="744" y="222" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">quoted words appear</text><text x="744" y="244" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">on that line</text><text x="744" y="284" text-anchor="start" style="fill:#1F7A3A;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700">pass ✓</text><path d="M703,225 L723,225" style="fill:none;stroke:#1F7A3A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f4-ah-ok)"/><line x1="824.0" y1="302" x2="824.0" y2="342" style="stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3"/><rect x="948" y="150" width="196" height="150" rx="12" style="fill:#FFFFFF;stroke:#1F7A3A;stroke-width:1.5"/><circle cx="970" cy="176" r="12" style="fill:#1F7A3A"/><text x="970" y="181" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700">4</text><text x="990" y="182" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:700">Figures match</text><text x="966" y="222" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">rates and fees appear</text><text x="966" y="244" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">exactly as stated</text><text x="966" y="284" text-anchor="start" style="fill:#1F7A3A;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700">pass ✓</text><path d="M925,225 L945,225" style="fill:none;stroke:#1F7A3A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f4-ah-ok)"/><line x1="1046.0" y1="302" x2="1046.0" y2="342" style="stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3"/><rect x="1170" y="150" width="196" height="150" rx="12" style="fill:#FFFFFF;stroke:#1F7A3A;stroke-width:1.5"/><circle cx="1192" cy="176" r="12" style="fill:#1F7A3A"/><text x="1192" y="181" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700">5</text><text x="1212" y="182" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:700">Fact-checker AI</text><text x="1188" y="222" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">a second AI checks</text><text x="1188" y="244" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">risky claims</text><text x="1188" y="284" text-anchor="start" style="fill:#1F7A3A;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700">pass ✓</text><path d="M1147,225 L1167,225" style="fill:none;stroke:#1F7A3A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f4-ah-ok)"/><line x1="1268.0" y1="302" x2="1268.0" y2="342" style="stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3"/><rect x="1396" y="150" width="164" height="150" rx="12" style="fill:#E7F4EA;stroke:#1F7A3A;stroke-width:1.5"/><text x="1414" y="182" text-anchor="start" style="fill:#1F7A3A;font-family:Segoe UI, Arial, sans-serif;font-size:15.5px;font-weight:700">Reported</text><text x="1414" y="214" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">with line numbers,</text><text x="1414" y="236" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">quotes and a</text><text x="1414" y="258" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">calculated confidence</text><path d="M1369,225 L1393,225" style="fill:none;stroke:#1F7A3A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f4-ah-ok)"/><line x1="380.0" y1="342" x2="1268.0" y2="342" style="stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3"/><text x="376.0" y="336" text-anchor="end" style="fill:#B42318;font-family:Segoe UI, Arial, sans-serif;font-size:12px;font-weight:700">fails</text><rect x="282" y="372" width="520" height="60" rx="12" style="fill:#FDECEA;stroke:#B42318;stroke-width:1.5"/><text x="302" y="399" text-anchor="start" style="fill:#B42318;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:700">Retry once</text><text x="302" y="420" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:400">the agent is asked again, with the reason it failed</text><path d="M542,345 L542,369" style="fill:none;stroke:#B42318;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f4-ah-danger)"/><path d="M282,402 L145,402 L145,303" style="fill:none;stroke:#B42318;stroke-width:1.8;stroke-linejoin:round;stroke-dasharray:5 4" marker-end="url(#f4-ah-danger)"/><text x="157" y="372" text-anchor="start" style="fill:#B42318;font-family:Segoe UI, Arial, sans-serif;font-size:12px;font-weight:600">new answer,</text><text x="157" y="388" text-anchor="start" style="fill:#B42318;font-family:Segoe UI, Arial, sans-serif;font-size:12px;font-weight:600">re-checked</text><rect x="850" y="372" width="710" height="60" rx="12" style="fill:#FDECEA;stroke:#B42318;stroke-width:1.5"/><text x="870" y="399" text-anchor="start" style="fill:#B42318;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:700">Still failing: removed, or set to &#x27;unclear&#x27;</text><text x="870" y="420" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:400">the call is marked &#x27;needs review&#x27; and sent to the review queue</text><path d="M805,402 L847,402" style="fill:none;stroke:#B42318;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f4-ah-danger)"/><text x="40" y="486" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:400">Confidence is calculated from the evidence (how well quotes match, how many lines support the claim, the fact-checker&#x27;s verdict), never taken from the AI&#x27;s own opinion of itself.</text><text x="40" y="514" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:400">Measured on 8 labelled test calls: 100% of reported evidence matched the transcript; no invented products.</text></svg>