<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="Privacy masking example: names, date of birth, card and mobile numbers in the raw transcript are replaced locally with placeholders such as CUST_NAME_1 and CARD_1 before any AI step."><defs><marker id="f3-ah-privacy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#0E7C72"/></marker></defs><rect width="1600" height="640" style="fill:#FFFFFF"/><text x="40" y="50" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:26px;font-weight:700">What the AI model sees</text><text x="40" y="78" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:400">Personal data is found and replaced on the bank&#x27;s own servers, before any AI step. The same person or card always gets the same placeholder, so the analysis still makes sense.</text><rect x="40" y="112" width="660" height="330" rx="14" style="fill:#FFFFFF;stroke:#B42318;stroke-width:1.6"/><rect x="40" y="112" width="660" height="46" rx="14" style="fill:#FDECEA;stroke:none;stroke-width:1.5"/><rect x="40" y="140" width="660" height="18" rx="0" style="fill:#FDECEA;stroke:none;stroke-width:1.5"/><text x="62" y="142" text-anchor="start" style="fill:#B42318;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700;letter-spacing:1.1px">RAW TRANSCRIPT (NEVER LEAVES THE BANK)</text><text x="62" y="196" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">12</text><text x="98" y="196" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">C:</text><text x="128" y="196" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#13202A;font-weight:400">Hi, this is </tspan><tspan style="fill:#B42318;font-weight:700">Rahul Sharma</tspan><tspan style="fill:#13202A;font-weight:400">.</tspan></text><text x="62" y="236" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">13</text><text x="98" y="236" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">A:</text><text x="128" y="236" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#13202A;font-weight:400">Can you confirm your date of birth?</tspan></text><text x="62" y="276" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">14</text><text x="98" y="276" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">C:</text><text x="128" y="276" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#13202A;font-weight:400">It is </tspan><tspan style="fill:#B42318;font-weight:700">fifth March nineteen ninety</tspan><tspan style="fill:#13202A;font-weight:400">.</tspan></text><text x="62" y="316" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">15</text><text x="98" y="316" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">C:</text><text x="128" y="316" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#13202A;font-weight:400">My card is </tspan><tspan style="fill:#B42318;font-weight:700">4111 1111 1111 1111</tspan><tspan style="fill:#13202A;font-weight:400">.</tspan></text><text x="62" y="356" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">16</text><text x="98" y="356" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">C:</text><text x="128" y="356" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#13202A;font-weight:400">Mobile: </tspan><tspan style="fill:#B42318;font-weight:700">nine eight seven six five…</tspan></text><text x="62" y="396" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">17</text><text x="98" y="396" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">A:</text><text x="128" y="396" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#13202A;font-weight:400">Thank you Mr. </tspan><tspan style="fill:#B42318;font-weight:700">Sharma</tspan><tspan style="fill:#13202A;font-weight:400">.</tspan></text><rect x="900" y="112" width="660" height="330" rx="14" style="fill:#FFFFFF;stroke:#0E7C72;stroke-width:1.6"/><rect x="900" y="112" width="660" height="46" rx="14" style="fill:#E3F3F0;stroke:none;stroke-width:1.5"/><rect x="900" y="140" width="660" height="18" rx="0" style="fill:#E3F3F0;stroke:none;stroke-width:1.5"/><text x="922" y="142" text-anchor="start" style="fill:#0E7C72;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:700;letter-spacing:1.1px">WHAT REACHES THE AI MODEL</text><text x="922" y="196" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">12</text><text x="958" y="196" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">C:</text><text x="988" y="196" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#13202A;font-weight:400">Hi, this is </tspan><tspan style="fill:#0E7C72;font-weight:700">&lt;CUST_NAME_1&gt;</tspan><tspan style="fill:#13202A;font-weight:400">.</tspan></text><text x="922" y="236" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">13</text><text x="958" y="236" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">A:</text><text x="988" y="236" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#13202A;font-weight:400">Can you confirm your date of birth?</tspan></text><text x="922" y="276" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">14</text><text x="958" y="276" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">C:</text><text x="988" y="276" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#0E7C72;font-weight:700">&lt;DOB_1&gt;</tspan><tspan style="fill:#13202A;font-weight:400">.</tspan></text><text x="922" y="316" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">15</text><text x="958" y="316" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">C:</text><text x="988" y="316" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#13202A;font-weight:400">My card is </tspan><tspan style="fill:#0E7C72;font-weight:700">&lt;CARD_1&gt;</tspan><tspan style="fill:#13202A;font-weight:400">.</tspan></text><text x="922" y="356" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">16</text><text x="958" y="356" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">C:</text><text x="988" y="356" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#13202A;font-weight:400">Mobile: </tspan><tspan style="fill:#0E7C72;font-weight:700">&lt;PHONE_1&gt;</tspan></text><text x="922" y="396" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:600">17</text><text x="958" y="396" text-anchor="start" style="fill:#55656F;font-family:Consolas, Menlo, monospace;font-size:14px;font-weight:700">A:</text><text x="988" y="396" text-anchor="start" style="font-family:Consolas, Menlo, monospace;font-size:15.5px"><tspan style="fill:#13202A;font-weight:400">Thank you Mr. </tspan><tspan style="fill:#0E7C72;font-weight:700">&lt;CUST_NAME_1&gt;</tspan><tspan style="fill:#13202A;font-weight:400">.</tspan></text><path d="M708,277 L892,277" style="fill:none;stroke:#0E7C72;stroke-width:2.4;stroke-linejoin:round" marker-end="url(#f3-ah-privacy)"/><text x="800" y="252" text-anchor="middle" style="fill:#0E7C72;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:700">masked locally</text><text x="800" y="306" text-anchor="middle" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:400">no AI involved</text><circle cx="50" cy="490" r="6" style="fill:#0E7C72"/><text x="66" y="496" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:700">Checksums</text><text x="66" y="518" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">card (Luhn) and Aadhaar (Verhoeff) checks recognise real card and ID numbers</text><circle cx="820" cy="490" r="6" style="fill:#0E7C72"/><text x="836" y="496" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:700">Spoken numbers</text><text x="836" y="518" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">&#x27;nine eight double seven…&#x27; is turned into digits first, so it cannot slip through</text><circle cx="50" cy="554" r="6" style="fill:#0E7C72"/><text x="66" y="560" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:700">Context aware</text><text x="66" y="582" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">the answer after &#x27;your date of birth?&#x27; is masked; names are remembered for the whole call</text><circle cx="820" cy="554" r="6" style="fill:#0E7C72"/><text x="836" y="560" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:700">Last line of defence</text><text x="836" y="582" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">a privacy guard re-checks every AI request and blocks it if anything remains</text></svg>