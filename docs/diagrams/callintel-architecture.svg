<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-label="CallIntel end-to-end flow: call transcripts are cleaned and masked inside a raw-data zone, triaged, turned into grounded facts by AI, analysed by specialist agents with the bank knowledge base, verified against the transcript and delivered as one JSON per call to dashboards."><defs><marker id="f1-ah-ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#A85A06"/></marker><marker id="f1-ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#13202A"/></marker><marker id="f1-ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#55656F"/></marker><marker id="f1-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#1F7A3A"/></marker><marker id="f1-ah-privacy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#0E7C72"/></marker></defs><rect width="1600" height="850" style="fill:#FFFFFF"/><text x="40" y="50" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:26px;font-weight:700">How CallIntel turns call transcripts into verified insights</text><text x="40" y="78" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:15px;font-weight:400">Agentic AI with retrieval (RAG)  ·  personal data masked before any AI step  ·  every insight traceable to the transcript</text><rect x="30" y="100" width="1540" height="616" rx="18" style="fill:#F3F6F8;stroke:#B8C4CC;stroke-width:1.5;stroke-dasharray:7 6"/><text x="52" y="128" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:12.5px;font-weight:700;letter-spacing:1.2px">BANK&#x27;S SECURE ENVIRONMENT (ON-PREMISE)</text><rect x="40" y="180" width="426" height="298" rx="14" style="fill:#E3F3F0;stroke:#0E7C72;stroke-width:1.5;stroke-dasharray:5 4"/><text x="54" y="202" text-anchor="start" style="fill:#0E7C72;font-family:Segoe UI, Arial, sans-serif;font-size:11.5px;font-weight:700;letter-spacing:1px">RAW PERSONAL DATA STAYS IN THIS ZONE</text><rect x="707" y="112" width="405" height="58" rx="10" style="fill:#FFFFFF;stroke:#B8C4CC;stroke-width:1.5"/><text x="909.5" y="136" text-anchor="middle" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15.5px;font-weight:700">Bank knowledge base (RAG)</text><text x="909.5" y="158" text-anchor="middle" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:400">product catalogue  ·  compliance rules  ·  sales playbook</text><path d="M800.0,171 L800.0,211" style="fill:none;stroke:#55656F;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f1-ah-muted)"/><text x="808.0" y="194" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:12px;font-weight:400">catalogue</text><path d="M1019.0,171 L1019.0,211" style="fill:none;stroke:#55656F;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f1-ah-muted)"/><text x="1027.0" y="194" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:12px;font-weight:400">rules &amp; playbook</text><rect x="50" y="214" width="186" height="250" rx="10" style="fill:#FFFFFF;stroke:#0E7C72;stroke-width:1.5"/><circle cx="72" cy="240" r="13" style="fill:#0E7C72"/><text x="72" y="245" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:700">1</text><text x="94" y="246" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:17px;font-weight:700">Call transcripts</text><text x="64" y="284" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">1,000+ files a day</text><text x="64" y="307" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">6,000+ lines each</text><text x="64" y="330" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">Agent &amp; customer turns</text><line x1="64" y1="424" x2="222" y2="424" style="stroke:#DCE3E8;stroke-width:1.2"/><text x="64" y="448" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:600">→ raw text</text><rect x="269" y="214" width="186" height="250" rx="10" style="fill:#FFFFFF;stroke:#0E7C72;stroke-width:1.5"/><circle cx="291" cy="240" r="13" style="fill:#0E7C72"/><text x="291" y="245" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:700">2</text><text x="313" y="246" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:17px;font-weight:700">Clean &amp; protect</text><text x="283" y="284" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">Remove noise &amp; repeats</text><text x="283" y="307" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">Mask personal data:</text><line x1="283" y1="424" x2="441" y2="424" style="stroke:#DCE3E8;stroke-width:1.2"/><text x="283" y="448" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:600">→ masked text</text><rect x="488" y="214" width="186" height="250" rx="10" style="fill:#FFFFFF;stroke:#B8C4CC;stroke-width:1.5"/><circle cx="510" cy="240" r="13" style="fill:#13202A"/><text x="510" y="245" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:700">3</text><text x="532" y="246" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:17px;font-weight:700">Focus</text><text x="502" y="284" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">Score every section</text><text x="502" y="307" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">for business signals</text><text x="502" y="330" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">Skip hold time and</text><text x="502" y="353" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">small talk</text><line x1="502" y1="424" x2="660" y2="424" style="stroke:#DCE3E8;stroke-width:1.2"/><text x="502" y="448" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:600">→ key sections</text><rect x="707" y="214" width="186" height="250" rx="10" style="fill:#FDF2E4;stroke:#A85A06;stroke-width:1.5"/><circle cx="729" cy="240" r="13" style="fill:#A85A06"/><text x="729" y="245" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:700">4</text><text x="751" y="246" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:17px;font-weight:700">Extract facts</text><text x="721" y="284" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">AI reads sections</text><text x="721" y="307" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">in parallel</text><text x="721" y="330" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">Each fact keeps its</text><text x="721" y="353" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">line &amp; exact quote</text><line x1="721" y1="424" x2="879" y2="424" style="stroke:#DCE3E8;stroke-width:1.2"/><text x="721" y="448" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:600">→ grounded facts</text><rect x="926" y="214" width="186" height="250" rx="10" style="fill:#FDF2E4;stroke:#A85A06;stroke-width:1.5"/><circle cx="948" cy="240" r="13" style="fill:#A85A06"/><text x="948" y="245" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:700">5</text><text x="970" y="246" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:17px;font-weight:700">Analyse</text><line x1="940" y1="424" x2="1098" y2="424" style="stroke:#DCE3E8;stroke-width:1.2"/><text x="940" y="448" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:600">→ insights + evidence</text><rect x="1145" y="214" width="186" height="250" rx="10" style="fill:#E7F4EA;stroke:#1F7A3A;stroke-width:1.5"/><circle cx="1167" cy="240" r="13" style="fill:#1F7A3A"/><text x="1167" y="245" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:700">6</text><text x="1189" y="246" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:17px;font-weight:700">Verify</text><text x="1159" y="284" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">Every claim checked</text><text x="1159" y="307" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">against the transcript</text><text x="1159" y="330" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">Unsupported: removed</text><text x="1159" y="353" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">Unsure: human review</text><line x1="1159" y1="424" x2="1317" y2="424" style="stroke:#DCE3E8;stroke-width:1.2"/><text x="1159" y="448" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:600">→ verified insights</text><rect x="1364" y="214" width="186" height="250" rx="10" style="fill:#FFFFFF;stroke:#B8C4CC;stroke-width:1.5"/><circle cx="1386" cy="240" r="13" style="fill:#13202A"/><text x="1386" y="245" text-anchor="middle" style="fill:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:700">7</text><text x="1408" y="246" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:17px;font-weight:700">Deliver</text><text x="1378" y="284" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">Same JSON structure</text><text x="1378" y="307" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">for every call</text><text x="1378" y="330" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">Dashboards &amp; BI</text><text x="1378" y="353" text-anchor="start" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:14.5px;font-weight:400">(Power BI, Parquet)</text><line x1="1378" y1="424" x2="1536" y2="424" style="stroke:#DCE3E8;stroke-width:1.2"/><text x="1378" y="448" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:600">→ insight tables</text><text x="283" y="339" text-anchor="start" style="fill:#0E7C72;font-family:Consolas, Menlo, monospace;font-size:12px;fon