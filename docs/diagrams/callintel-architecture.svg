" marker-end="url(#f1-ah-ink)"/><path d="M458,339 L485,339" style="fill:none;stroke:#13202A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f1-ah-ink)"/><path d="M677,339 L704,339" style="fill:none;stroke:#13202A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f1-ah-ink)"/><path d="M896,339 L923,339" style="fill:none;stroke:#13202A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f1-ah-ink)"/><path d="M1115,339 L1142,339" style="fill:none;stroke:#13202A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f1-ah-ink)"/><path d="M1334,339 L1361,339" style="fill:none;stroke:#13202A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f1-ah-ink)"/><rect x="50" y="497" width="1500" height="54" rx="12" style="fill:#E2E8ED;stroke:none;stroke-width:1.5"/><text x="72" y="519" text-anchor="start" style="font-family:Segoe UI, Arial, sans-serif;font-size:14px"><tspan style="fill:#13202A;font-weight:700">Redis backbone  </tspan><tspan style="fill:#55656F;font-weight:400">work queue for parallel workers  ·  progress log (no call twice)</tspan></text><text x="72" y="540" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:14px;font-weight:400">AI answer cache  ·  learned product names  ·  rate limits</text><rect x="707" y="592" width="624" height="80" rx="12" style="fill:#FDF2E4;stroke:#A85A06;stroke-width:1.5"/><text x="1019.0" y="620" text-anchor="middle" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:16px;font-weight:700">AI model gateway</text><text x="1019.0" y="643" text-anchor="middle" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:400">local model on bank GPUs, or an approved cloud model</text><text x="1019.0" y="663" text-anchor="middle" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:400">privacy guard blocks any request that still has personal data</text><path d="M800.0,467 L800.0,589" style="fill:none;stroke:#A85A06;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f1-ah-ai)" marker-start="url(#f1-ah-ai)"/><path d="M1019.0,467 L1019.0,589" style="fill:none;stroke:#A85A06;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f1-ah-ai)" marker-start="url(#f1-ah-ai)"/><path d="M1238.0,467 L1238.0,589" style="fill:none;stroke:#A85A06;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f1-ah-ai)" marker-start="url(#f1-ah-ai)"/><text x="809.0" y="484" text-anchor="start" style="fill:#A85A06;font-family:Segoe UI, Arial, sans-serif;font-size:12px;font-weight:600">AI calls</text><rect x="1364" y="592" width="186" height="80" rx="12" style="fill:#E7F4EA;stroke:#1F7A3A;stroke-width:1.5"/><text x="1457.0" y="620" text-anchor="middle" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:16px;font-weight:700">Quality gate</text><text x="1457.0" y="643" text-anchor="middle" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:400">scored on labelled calls</text><text x="1457.0" y="663" text-anchor="middle" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:400">before every release</text><path d="M1457.0,467 L1457.0,589" style="fill:none;stroke:#1F7A3A;stroke-width:1.8;stroke-linejoin:round" marker-end="url(#f1-ah-ok)"/><text x="1466.0" y="484" text-anchor="start" style="fill:#1F7A3A;font-family:Segoe UI, Arial, sans-serif;font-size:12px;font-weight:600">measured</text><rect x="54" y="606" width="30" height="20" rx="5" style="fill:#E3F3F0;stroke:#0E7C72;stroke-width:1.3;stroke-dasharray:5 4"/><text x="96" y="621" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:400">raw personal data zone</text><rect x="354" y="606" width="30" height="20" rx="5" style="fill:#FDF2E4;stroke:#A85A06;stroke-width:1.3"/><text x="396" y="621" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:400">AI step</text><rect x="54" y="640" width="30" height="20" rx="5" style="fill:#E7F4EA;stroke:#1F7A3A;stroke-width:1.3"/><text x="96" y="655" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:400">verification</text><rect x="354" y="640" width="30" height="20" rx="5" style="fill:#FFFFFF;stroke:#B8C4CC;stroke-width:1.3"/><text x="396" y="655" text-anchor="start" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13.5px;font-weight:400">rule-based step (no AI)</text><rect x="834.0" y="752" width="370" height="74" rx="12" style="fill:#FFFFFF;stroke:#B8C4CC;stroke-width:1.5;stroke-dasharray:6 5"/><text x="1019.0" y="781" text-anchor="middle" style="fill:#13202A;font-family:Segoe UI, Arial, sans-serif;font-size:15.5px;font-weight:700">Cloud AI model (optional)</text><text x="1019.0" y="805" text-anchor="middle" style="fill:#55656F;font-family:Segoe UI, Arial, sans-serif;font-size:13px;font-weight:400">e.g. OpenAI  ·  receives masked text only</text><path d="M1019.0,675 L1019.0,749" style="fill:none;stroke:#0E7C72;stroke-width:1.8;stroke-linejoin:round;stroke-dasharray:6 4" marker-end="url(#f1-ah-privacy)" marker-start="url(#f1-ah-privacy)"/><text x="1029.0" y="741" text-anchor="start" style="fill:#0E7C72;font-family:Segoe UI, Arial, sans-serif;font-size:12.5px;font-weight:700">masked text only</text></svg>